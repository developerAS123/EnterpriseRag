services:
  agentic-rag-copilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it-support-agentic-rag
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - PORT=8080
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-industry-agentic-rag-kb}
      - PINECONE_NAMESPACE=${PINECONE_NAMESPACE:-company-kb}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-admin-secret}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
