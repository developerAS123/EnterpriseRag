name: CI Pipeline - Agentic RAG Copilot

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Create virtual environment
        run: uv venv --python 3.11 .venv

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Syntax and byte-compile verification
        run: .venv/bin/python -m compileall -q app/ tests/ scripts/

      - name: Run automated test suite
        run: .venv/bin/pytest -v

      - name: Run benchmark evaluation in mock mode
        run: .venv/bin/python scripts/run_evaluation.py --mock --sample 15

      - name: Verify evaluation reports generated
        run: |
          test -f data/reports/eval_report_latest.json
          test -f data/reports/eval_report_latest.html
          echo "Evaluation reports verified successfully."
